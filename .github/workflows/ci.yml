name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install pyyaml
      - name: Validate skill frontmatter
        run: |
          python - <<'PY'
          import pathlib, yaml
          text = pathlib.Path("patent-research-skill/SKILL.md").read_text(encoding="utf-8")
          assert text.startswith("---"), "missing YAML frontmatter"
          fm = yaml.safe_load(text.split("---", 2)[1])
          assert fm["name"] == "patent-research"
          assert fm["description"].strip()
          assert fm.get("metadata", {}).get("version")
          print("skill version:", fm["metadata"]["version"])
          PY
      - name: Syntax check scripts
        run: python -m compileall -q patent-research-skill/scripts
      - name: Assessment protocol contract
        run: python -m unittest discover -s tests -v
      - name: Reconstruct patched kernel from verified public source
        run: |
          python - <<'PY'
          import hashlib, io, pathlib, tarfile, urllib.request
          url = "https://github.com/cyy1018abc-kyy/patent-research-skill/releases/download/patentkit-v0.1.2/patentkit-0.1.2.tar.gz"
          data = urllib.request.urlopen(url, timeout=60).read()
          assert hashlib.sha256(data).hexdigest() == "5ab1ff6e6387c1b6f30e8e084b0da88d93bf71426e9cb901158562d9b52aae14"
          destination = pathlib.Path("kernel-build")
          destination.mkdir()
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as archive:
              archive.extractall(destination, filter="data")
          PY
          git apply --directory=kernel-build/patentkit-0.1.2 "$GITHUB_WORKSPACE/release/patches/patentkit-0.1.2-to-0.2.0.patch"
          test -f kernel-build/patentkit-0.1.2/patentkit/assessment.py
      - name: Install and test patched kernel
        run: |
          python -m pip install -e "./kernel-build/patentkit-0.1.2[dev]"
          python -c "import patentkit; assert patentkit.__version__ == '0.2.0', patentkit.__version__"
          python -m pytest kernel-build/patentkit-0.1.2/regression_tests -o addopts= -q
      - name: Shell syntax check
        run: bash -n release/install.sh
      - name: Required files
        run: |
          test -f release/install.ps1
          test -f release/install-oneclick.cmd
          test -f release/INSTALL.md
          test -f release/install-guide-for-colleagues.md
          test -f patent-research-skill/agents/openai.yaml
          echo "package layout ok"
