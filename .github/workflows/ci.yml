name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PATENTKIT_COMPAT_VERSION: "0.1.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install pyyaml
      - name: Syntax check
        run: python -m compileall -q tools patent-research-skill/scripts
      - name: Build release package (smoke, no samples)
        run: |
          python tools/build_skill_release.py --out dist --no-samples --built-at 2026-10-22T00:00:00+08:00 --json
          python - <<'PY'
          import json, pathlib, zipfile
          zips = sorted(pathlib.Path("dist").glob("patent-research-skill-v*.zip"))
          assert zips, "release package not generated"
          with zipfile.ZipFile(zips[0]) as zf:
              names = set(zf.namelist())
          for required in ("manifest.json", "install.ps1", "install.sh", "install-oneclick.cmd"):
              assert required in names, f"missing {required}"
          print("ok:", zips[0].name, len(names), "entries")
          PY
      - name: Installer dry-run (from built package)
        run: |
          cd dist
          unzip -q patent-research-skill-v*.zip -d pkg
          bash pkg/install.sh --dry-run --dest "$RUNNER_TEMP/skills" --no-self-check
