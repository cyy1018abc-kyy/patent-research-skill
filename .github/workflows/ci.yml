name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install pyyaml
      - name: Validate skill frontmatter
        run: |
          python - <<'PY'
          import pathlib, yaml
          text = pathlib.Path("patent-research-skill/SKILL.md").read_text(encoding="utf-8")
          assert text.startswith("---"), "missing YAML frontmatter"
          fm = yaml.safe_load(text.split("---", 2)[1])
          assert fm["name"] == "patent-research"
          assert fm["description"].strip()
          assert fm.get("metadata", {}).get("version")
          print("skill version:", fm["metadata"]["version"])
          PY
      - name: Syntax check scripts
        run: python -m compileall -q patent-research-skill/scripts
      - name: Shell syntax check
        run: bash -n release/install.sh
      - name: Required files
        run: |
          test -f release/install.ps1
          test -f release/install-oneclick.cmd
          test -f release/INSTALL.md
          test -f release/INSTALL-colleagues.md
          test -f patent-research-skill/agents/openai.yaml
          echo "package layout ok"
