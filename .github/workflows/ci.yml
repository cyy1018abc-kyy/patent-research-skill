name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and test dependencies
        run: python -m pip install build pytest pyyaml
      - name: Reconstruct patched kernel from verified public source
        run: |
          python - <<'PY'
          import hashlib, io, pathlib, tarfile, urllib.request
          url = "https://github.com/cyy1018abc-kyy/patent-research-skill/releases/download/patentkit-v0.1.2/patentkit-0.1.2.tar.gz"
          data = urllib.request.urlopen(url, timeout=60).read()
          assert hashlib.sha256(data).hexdigest() == "5ab1ff6e6387c1b6f30e8e084b0da88d93bf71426e9cb901158562d9b52aae14"
          destination = pathlib.Path("kernel-build")
          destination.mkdir()
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as archive:
              archive.extractall(destination, filter="data")
          PY
          git apply --directory=kernel-build/patentkit-0.1.2 "$GITHUB_WORKSPACE/release/patches/patentkit-0.1.2-to-0.9.0.patch"
          test -f kernel-build/patentkit-0.1.2/patentkit/assessment.py
          test -f kernel-build/patentkit-0.1.2/patentkit/provenance.py
          test -f kernel-build/patentkit-0.1.2/patentkit/revise.py
          test -f kernel-build/patentkit-0.1.2/patentkit/census.py
          test -f kernel-build/patentkit-0.1.2/patentkit/fetch_bigquery.py
          test -f kernel-build/patentkit-0.1.2/patentkit/contracts.py
          test -f kernel-build/patentkit-0.1.2/patentkit/workspace_upgrade.py
          test -f kernel-build/patentkit-0.1.2/patentkit/source_intake.py
          test -f kernel-build/patentkit-0.1.2/patentkit/discovery.py
          test -f kernel-build/patentkit-0.1.2/patentkit/discovery_handoff.py
          test -f kernel-build/patentkit-0.1.2/patentkit/draft.py
          test -f kernel-build/patentkit-0.1.2/patentkit/figure_plan.py
          test -f kernel-build/patentkit-0.1.2/patentkit/delivery.py
          test -f kernel-build/patentkit-0.1.2/tests/test_delivery.py
      - name: Build and install the actual kernel wheel
        run: |
          python -m build ./kernel-build/patentkit-0.1.2 --outdir dist
          python -m pip install dist/patentkit-0.9.0-py3-none-any.whl python-docx
          python -c "import patentkit; from patentkit.assessment import PROTOCOL_VERSION; assert patentkit.__version__ == '0.9.0' and PROTOCOL_VERSION == 1; assert 'site-packages' in patentkit.__file__"
      - name: Install the optional patent_intel extension (stdlib-only base)
        run: |
          python -m pip install -e extensions/patent_intel --no-deps
          python -m patent_intel doctor --json
      - name: Kernel assessment and delivery-safety regressions
        run: python -m pytest kernel-build/patentkit-0.1.2/regression_tests -o addopts= -q
      - name: Kernel full suite from the patched tree
        run: python -m pytest kernel-build/patentkit-0.1.2/tests -o addopts= -q
      - name: Build the official skill package
        run: |
          python tools/build_skill_release.py --out dist --built-at "$(git show -s --format=%cI HEAD)" --json > build-result.json
          python - <<'PY'
          import hashlib, pathlib, shutil
          dist = pathlib.Path("dist")
          assets = sorted(dist.glob("patentkit-0.9.0*"))
          assert len(assets) == 2
          (dist / "SHA256SUMS-patentkit-v0.9.0.txt").write_text("".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in assets), encoding="utf-8")
          shutil.copy2("release/install-oneclick.cmd", dist)
          PY
      - name: Skill eval manifest is well formed
        run: python evals/validate_evals.py
      - name: Terminology consistency between zh and en references
        run: python evals/check_terminology.py
      - name: Release version pairing points are consistent
        run: python tools/bump_version.py --check
      - name: No real workspace data may enter the distribution
        run: python tools/check_no_workspace_data.py
      - name: Reference links resolve inside every skill payload (repo tree + unpacked zips)
        run: |
          python tools/check_reference_links.py
          python - <<'PY'
          import pathlib, subprocess, sys, tempfile, zipfile
          zips = sorted(pathlib.Path("dist").glob("*-skill-v*.zip"))
          assert len(zips) == 2, f"expected the full + drafting release zips, got {zips}"
          for zip_path in zips:
              with tempfile.TemporaryDirectory() as tmp:
                  zipfile.ZipFile(zip_path).extractall(tmp)
                  subprocess.run([sys.executable, "tools/check_reference_links.py",
                                  "--root", tmp, "--quiet"], check=True)
          print("packaged payloads checked:", [p.name for p in zips])
          PY
      - name: Skill protocol and installation acceptance
        run: python -m unittest discover -s tests -v
      - name: Extension and boundary regression suite (pytest)
        run: python -m pytest tests extensions/patent_intel/tests -o addopts= -q
      - name: Benchmark gold solutions score perfect (scorer semantics locked)
        run: python tools/score_benchmark.py --suite benchmarks/cases --gold --gate perfect
      - name: Release doctor offline preflight (pairing + guards + build + installers)
        run: python tools/release_doctor.py --offline --dist dist --json > release-doctor-offline.json
      - name: Syntax checks
        run: |
          python -m compileall -q research/scripts tools evals benchmarks
          bash -n release/install.sh
          bash -n tools/publish_release.sh
          git diff --check
      - name: Preserve verified release assets
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Publish the paired releases after all installation checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/publish_release.sh

  release-doctor:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 祖先判定需要完整历史（发布后有补充提交时 target_commitish 落后于 HEAD）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML for the pairing check
        run: python -m pip install pyyaml
      - name: Audit the actual releases and run install tests against downloaded assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/release_doctor.py --release --expect-commit "${{ github.sha }}"