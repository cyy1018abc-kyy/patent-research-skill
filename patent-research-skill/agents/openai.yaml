# Desktop (Codex / ChatGPT App) display and invocation metadata.
# Spec: https://learn.chatgpt.com/docs/build-skills#optional-metadata
# Effect: shows the display name and summary in the Skills sidebar/selector; selecting via @ automatically attaches the default prompt.
# Note: display_name / short_description are desktop UI strings and do not affect trigger matching;
#      triggering is still determined by the description in SKILL.md.
interface:
  display_name: "Patent Research"
  short_description: "Prior-art search, evidence chain, and acceptance gates (G-S)"
  default_prompt: "Start with the patent-research skill: locate the workspace and self-check first, then proceed in execution order; when tools cannot run, begin each conclusion with \"⚠️ Unverified by tool checks\"."
  brand_color: "#1F6FEB"
policy:
  # Allow implicit triggering by description (default true; the desktop app can also select explicitly via @)
  allow_implicit_invocation: true
