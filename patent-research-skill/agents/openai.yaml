# Desktop app (Codex / ChatGPT app) metadata.
# Spec: https://learn.chatgpt.com/docs/build-skills#optional-metadata
# Purpose: shows a display name/description in the Skills sidebar and inserts a
# default prompt when the skill is selected with @.
# Note: display_name / short_description are UI text; triggering is still driven by
#       the `description` in SKILL.md.
interface:
  display_name: "Patent Research"
  short_description: "Prior-art search, evidence chain & acceptance gates (G-S)"
  default_prompt: "Use the patent-research skill: locate the workspace and self-check first, then follow the execution order. If tools cannot run, start the conclusion with 「⚠️ 未经验证工具校验」."
  brand_color: "#1F6FEB"
policy:
  # Allow implicit invocation by description (default true); @ selection still works.
  allow_implicit_invocation: true
