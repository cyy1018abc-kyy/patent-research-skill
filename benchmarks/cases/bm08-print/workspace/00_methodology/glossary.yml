# Glossary — the single authoritative definition for the whole workspace
#
# ⚠️ This file is the "single source of truth": axis names, role, evidence levels, and relevance
#    criteria are defined only here. Other files reference this file and must not coin their own abbreviations.
#
# ⚠️ YAML pitfall: every list item in this file is **quoted**.
#    A `- **never determine on behalf of others**` entry was once parsed by YAML as an alias node,
#    which made the whole file unreadable.

version: 1
updated: '2026-01-01'
active_target: TGT-9008

# ── Targets ───────────────────────────────────────────────────────────
targets:
  TGT-9008:
    title: "3D 打印在线监测 —— 引用准确性专项"
    status: active
    note: 'Generated by init; please add the technical field and the core inventive points'

# ── Technical axes ────────────────────────────────────────────────────
# Axis IDs are always target-qualified: N1@TGT-xxxx. A bare N1 is blocked by validate's V023.
axes:
  N1@TGT-9008: { title_zh: '电流纹波判别', title_en: '', kind: primary }
  N2@TGT-9008: { title_zh: '逐层成像比对', title_en: '', kind: primary }
  N3@TGT-9008: { title_zh: '缺陷回退重打', title_en: '', kind: primary }
  N4@TGT-9008: { title_zh: '样本入库更新', title_en: '', kind: primary }

# ── Values of novelty_check ───────────────────────────────────────────
novelty_states:
  untouched:
    label: Untouched
    description: 'Not yet reviewed; or reviewed and confirmed unrelated to this invention''s technical subject matter (mis-mapping / false positive)'
  partial:
    label: Partially disclosed
    description: 'Discloses only some features of this invention'
  covered:
    label: Covered
    description: 'Discloses all features of a single claim, but does not cover the overall technical solution'
  blocking:
    label: Blocking
    description: 'A single document covers all core technical features of this invention, constituting a novelty obstacle'

# ── Values of role (determines which gate a candidate enters) ─────────
roles:
  near_prior_art:
    label: Near prior art
    description: 'Enters column D of the 04 comparison matrix; counts toward G-S-03 / G-S-04'
  pool:
    label: Ordinary pool candidate
    description: 'Counts toward G-S-02; does not enter the comparison matrix'
  excluded:
    label: Excluded
    description: 'Mis-mapping / false positive / duplicate / belongs to another target; counts toward no gate'
  family:
    label: Family member
    description: 'Counts toward G-S-04'

# ── relevance: two-dimensional composition ────────────────────────────
relevance_levels:
  5: { label: Identical, description: 'Both the technical problem and the technical means fully overlap with this invention' }
  4: { label: Highly relevant, description: 'Same problem with mainly the same means; or same means with the problem differing only in scenario' }
  3: { label: Same field, description: 'Same technical field but a different sub-problem or implementation', is_default: true }
  2: { label: Related field, description: 'Adjacent technical field; only the underlying principle is shared' }
  1: { label: Unrelated, description: 'Neither the technical problem nor the technical means is related' }

relevance_dimensions:
  problem:
    label: Technical problem
    field: relevance_problem
    levels: [1, 2, 3, 4, 5]
    question: 'How much does the technical problem it solves overlap with this invention''s technical problem?'
  means:
    label: Technical means
    field: relevance_means
    levels: [1, 2, 3, 4, 5]
    question: 'How much do the technical means it adopts overlap with this invention''s technical means?'
  compose:
    formula: 'min(problem, means)'
    note: 'Take min rather than the average: both dimensions must qualify. If the problem differs, similar means still do not constitute a comparison.'

relevance_rules:
  - 'The two dimensions must be scored separately; a single composite score alone is not allowed'
  - 'If the technical problem differs, similar means still do not constitute a comparison (min rule)'
  - 'Supported AI assessments may count for G-S-02; G-S-03 requires current explicit human confirmation'
  - 'Default relevance=3 on entry; once judged, reviewed_at must be written'
  - 'Record actor and per-axis problem/means original-text citations; AI proposals never overwrite human decisions'
  - 'A single-dimension or unknown-origin judgment does not count toward G-S-02/G-S-03'

# ── Evidence levels ───────────────────────────────────────────────────
evidence_levels:
  verified:
    label: Verified
    description: 'A replayable raw artifact exists in the repo (raw/ present, non-empty, capture_mode=live)'
    counts_for_pass: true
  attested:
    label: Attested
    description: 'External data + in-repo sha256 binding; proves which file was consulted, not that the content is correct'
    counts_for_pass: false
  asserted:
    label: Self-asserted
    description: 'Unverified source provenance; judgment actor is recorded separately and never changes the source grade'
    counts_for_pass: false

# ── Database aliases (used by ingest) ─────────────────────────────────
# NOTE: data literal, intentionally untranslated: the two Chinese aliases below are matched
# against external data by patentkit.registry.normalize_db; keep them byte-identical.
db_aliases:
  cnipa: [cnipa, 国知局, sipo]
  espacenet: [espacenet, ep]
  googlepatents: [googlepatents, gp, google_patents]
  crossref: [crossref, cr]
  ai_aa: [aiaa, ai_aa]
  cnki: [cnki, 知网]
