# 案例元数据与任务卡（bm03-agv）
id: bm03-agv
title: 仓储多 AGV 调度 —— 误判率专项
focus: misjudgment
difficulty: hard
target: TGT-9003
metrics_weight:
  citation_precision: 0.2
  citation_coverage: 0.1
  feature_omission: 0.2
  misjudgment: 0.5
traps:
  - ZZ900032A1 通篇最"像"目标（AGV+中央调度+优先级），最容易判 blocking——但 [0005] 固定路径、[0008] 不看拥堵度、[0009] 固定时序轮询、[0010] 故障靠人工，真值是 partial
  - ZZ900035A1 的"集群避让"与 F2 撞关键词，但三维空域无车道无路口，真值是 excluded 而非 near_prior_art
  - ZZ900031B1 [0007] 有拥堵度分配却无任务优先级，且 [0009] 自认不适用于 AGV——partial 与 relevance_problem=2 需要同时站住
  - ZZ900033A2 [0006]–[0008] 的"请求-放行"与 F3 的预约制一字不差地像，但请求不携带占用时长、按序轮询，真值是 partial
task: |
  工作区已预置：5 条检索日志与 raw 工件、已 ingest 的 5 个候选（P-001..P-005，均
  untouched）、目标 TGT-9003 的权利要求（见 07_drafting/claims.md 与本案例
  corpus/target_claims.md）。语料是编造的合成文献，全文在 02_search_logs/raw/。
  请按 patent-research 技能的执行顺序完成判断链：
  1. review export → 逐候选评估：relevance_problem / relevance_means / novelty_check / role /
     feature_mapping（状态与引文，格式见 benchmarks/README.md；F1..F4 逐个表态）；
  2. review assess --apply → 对全部 near_prior_art 候选做显式人工确认（review confirm --apply，
     --by 填 benchmark-operator）→ attest --apply；
  3. 填 04_comparative_analysis/comparison_matrix.md（含每列输出，关键段落用 路径#L行：摘句 形态）；
  4. 写 05_novelty_conclusions/conclusions.md（引用证据账本中存在的 P 编号）。
