# 案例元数据与任务卡（bm01-timesync）
id: bm01-timesync
title: 无线传感网时间同步 —— 引用准确性专项
focus: citation
difficulty: medium
target: TGT-9001
metrics_weight:
  citation_precision: 0.6
  citation_coverage: 0.2
  feature_omission: 0.1
  misjudgment: 0.1
traps:
  - ZZ900011A1 的 [0006] 与 [0005] 都谈"用信标校正时钟"，但 F1（发送时刻估计值）的依据只在 [0004]，误引相邻段落即失分
  - ZZ900013A1 的 [0005]/[0006]/[0007] 三段连续谈周期调整，只有 [0007] 含"稳定性"依据
  - 拼写级陷阱：ZZ900014A1 的"重传请求帧"与 F4 的"重同步请求帧"一字之差，照抄即引错
task: |
  工作区已预置：4 条检索日志与 raw 工件（每篇对比文献一个日志）、已 ingest 的 4 个候选
  （P-001..P-004，均 untouched）、目标 TGT-9001 的权利要求（见 07_drafting/claims.md 与
  本案例 corpus/target_claims.md）。语料是编造的合成文献，全文在
  02_search_logs/raw/ZZ9000xxA1.md。
  请按 patent-research 技能的执行顺序完成判断链：
  1. review export → 逐候选评估：relevance_problem / relevance_means / novelty_check / role /
     feature_mapping（状态与引文，格式见 benchmarks/README.md）；
  2. review assess --apply → 对全部 near_prior_art 候选做显式人工确认（review confirm --apply，
     --by 填 benchmark-operator）→ attest --apply；
  3. 填 04_comparative_analysis/comparison_matrix.md（含每列输出，关键段落用 路径#L行：摘句 形态）；
  4. 写 05_novelty_conclusions/conclusions.md（引用证据账本中存在的 P 编号）。
