id: dm03-inv-clean
description: 发明（负载切换控制系统与方法），方法独立权项引用系统、从属权项单引用、数值范围有端点；期望零发现。
application_type: invention
title: 一种负载切换控制系统及方法
structured_claims:
  - {claim_no: 1, claim_type: independent, parent_claim_no: null}
  - {claim_no: 2, claim_type: dependent, parent_claim_no: 1}
  - {claim_no: 3, claim_type: independent, parent_claim_no: null}
  - {claim_no: 4, claim_type: dependent, parent_claim_no: 3}
figures:
  - figure_id: FIG-1
    parts: [{label: 检测单元, mark: "10"}, {label: 控制单元, mark: "20"}, {label: 执行机构, mark: "30"}]
  - figure_id: FIG-2
    parts: []
claims: |
  1. 一种负载切换控制系统，包括检测单元(10)、控制单元(20)和执行机构(30)，其特征在于，所述检测单元(10)用于检测负载变化率，所述控制单元(20)在所述负载变化率超过阈值时向所述执行机构(30)发出切换命令。
  2. 根据权利要求1所述的负载切换控制系统，其特征在于，所述阈值为5%至8%。
  3. 一种负载切换控制方法，采用权利要求1所述的负载切换控制系统，其特征在于，包括：检测负载变化率；在所述负载变化率超过阈值时切换运行模式。
  4. 根据权利要求3所述的负载切换控制方法，其特征在于，所述运行模式包括节能模式和满载模式。
specification: |
  技术领域
  [0001] 本发明涉及能源装备控制技术领域，具体涉及一种负载切换控制系统及方法。
  背景技术
  [0002] 现有控制系统按固定时间切换运行模式，无法响应负载突变。
  发明内容
  [0003] 本发明提供一种负载切换控制系统，检测单元10检测负载变化率，控制单元20在变化率超过阈值时控制执行机构30切换运行模式。
  [0004] 阈值为5%至8%，例如6%。
  附图说明
  [0005] 图1为本发明负载切换控制系统的结构框图。
  [0006] 图2为本发明负载切换控制方法的流程图。
  具体实施方式
  [0007] 如图1所示，检测单元10与控制单元20连接，控制单元20与执行机构30连接。
  [0008] 如图2所示，方法包括检测负载变化率和切换运行模式两个步骤，运行模式包括节能模式和满载模式。
abstract: |
  本发明公开了一种负载切换控制系统及方法，检测单元检测负载变化率，控制单元在负载变化率超过阈值时控制执行机构切换运行模式，能够及时响应负载突变。
expected: []
