  [0002] 现有控制系统按固定时间切换运行模式。
  实用新型内容
  [0003] 本实用新型提供一种负载切换控制系统，检测单元10检测负载变化率，控制单元40控制执行机构30。
  附图说明
  [0004] 图1为负载切换控制系统的结构框图。
  [0004] 图3为方法流程图。
  具体实施方式
  [0005] 如图1所示，检测单元10与控制单元20连接。
abstract: |
  本发明公开了一种负载切换控制系统，在负载变化率超过阈值时切换运行模式。
