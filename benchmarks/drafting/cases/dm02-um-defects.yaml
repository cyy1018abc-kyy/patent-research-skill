specification: |
  技术领域
  [0001] 本发明涉及收纳用品技术领域，具体涉及一种卡扣式储物盒。
  实用新型内容
  [0002] 本实用新型提供一种卡扣式储物盒，壳体1顶部设有卡槽11。
